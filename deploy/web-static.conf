server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|woff|woff2|png|jpg|jpeg|gif|webp|svg|ico)$ {
    expires 14d;
    add_header Cache-Control "public, max-age=1209600, immutable";
    try_files $uri =404;
  }
}
